<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — Gongpe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }

    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.25rem, 6vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    p {
      color: #94a3b8;
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .contact-btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      background: #38bdf8;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .contact-btn:hover {
      background: #7dd3fc;
    }

    .contact-note {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .contact-note a {
      color: #38bdf8;
      text-decoration: none;
    }

    .contact-note a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 48px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="badge">Launching Soon</span>
    <h1>Something new is on the way.</h1>
    <p>
      We’re putting the finishing touches on our site. Stay tuned for our launch,
      or reach out to our team if you have any questions.
    </p>

    <a class="contact-btn" href="mailto:support@gongpe.com">Contact Support</a>

    <div class="contact-note">
      Email us at <a href="mailto:support@gongpe.com">support@gongpe.com</a>
    </div>

    <footer>&copy; <span id="year"></span> Gongpe. All rights reserved.</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
